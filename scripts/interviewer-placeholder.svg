<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="78%">
      <stop offset="0%" stop-color="#1c2b28"/>
      <stop offset="55%" stop-color="#15191c"/>
      <stop offset="100%" stop-color="#0b0c0e"/>
    </radialGradient>
    <linearGradient id="figure" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3f4b51"/>
      <stop offset="100%" stop-color="#232a2f"/>
    </linearGradient>
    <linearGradient id="shoulders" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2b3a3d"/>
      <stop offset="100%" stop-color="#1a2124"/>
    </linearGradient>
    <filter id="soften" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
  </defs>

  <rect width="640" height="640" fill="url(#bg)"/>

  <!-- rim light behind the figure -->
  <ellipse cx="320" cy="300" rx="176" ry="196" fill="#34d399" opacity="0.11" filter="url(#glow)"/>

  <!-- shoulders -->
  <path d="M112 640 C 126 496 205 430 320 430 C 435 430 514 496 528 640 Z"
        fill="url(#shoulders)" filter="url(#soften)"/>

  <!-- neck -->
  <path d="M281 392 h78 v58 c0 22 -78 22 -78 0 Z" fill="#283034" filter="url(#soften)"/>

  <!-- head -->
  <ellipse cx="320" cy="286" rx="104" ry="122" fill="url(#figure)" filter="url(#soften)"/>

  <!-- subtle key light on one side -->
  <ellipse cx="278" cy="262" rx="62" ry="80" fill="#4d5b62" opacity="0.35" filter="url(#soften)"/>
</svg>
